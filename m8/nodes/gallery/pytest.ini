[pytest]
testpaths = tests

# The plugin root is itself a Python package (its __init__.py boots every node
# and imports torch/folder_paths/server). pytest builds a Package collector for
# that directory and would import the ComfyUI entry point, so point rootdir at
# tests/ explicitly:
#     python -m pytest -q --rootdir=tests tests
# Importlib mode keeps module naming independent of the plugin folder name.
addopts = --import-mode=importlib
