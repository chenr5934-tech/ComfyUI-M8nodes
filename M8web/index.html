<!DOCTYPE html>
<html lang="en" data-i18n-title="homeTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M8 Workbench</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <script>
    /* 主题必须在这里定，不能等 boot()：外部脚本加载完再设的话，
       选了黑夜主题的人会先看见一帧白底，夜里很刺眼。
       注意设的是 documentElement —— app.js 的 applyTheme 也必须设同一个元素。 */
    try {
      var t = localStorage.getItem("m8web.theme");
      document.documentElement.dataset.theme = t || "night";
    } catch (e) {
      document.documentElement.dataset.theme = "night";
    }
  </script>
</head>
<body>
  <div id="fx" aria-hidden="true"></div>
  <div class="shell">
    <div id="sidebar"></div>
    <div class="main">
      <div class="content">
        <header class="hero">
          <h1 data-i18n="heroTitle">M8 Workbench</h1>
          <p data-i18n="heroLede">A layer of its own on top of ComfyUI: the chores that come after generating an image, all done in one place. The same feature list is in the sidebar on the left, so you can switch back and forth.</p>
          <div class="hero-tools">
            <button class="ghost-btn" id="mkShortcut" type="button"
              data-i18n="mkShortcut"
              data-i18n-attr="title:mkShortcutTip">+ Create desktop shortcut</button>
            <span class="hero-note" id="mkShortcutNote"></span>
          </div>
        </header>
        <div id="cards" class="cards"></div>
      </div>
    </div>
  </div>
  <!-- app.js / migrate.js 是普通脚本，boot 和 renderCards 靠函数声明挂在全局。
       下面那段用 module：module 天然延迟到普通脚本之后执行，正好等得到它们；
       而且 import 语法只能在 module 里用。 -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/migrate.js"></script>
  <script type="module">
    import { bootI18n } from "./assets/js/i18n.js";
    await bootI18n();
    boot({ activeId: "", base: "" });
    renderCards(document.getElementById("cards"));
  </script>
</body>
</html>
