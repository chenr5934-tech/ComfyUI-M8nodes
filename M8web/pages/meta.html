<!DOCTYPE html>
<html lang="en" data-i18n-title="feat.meta.pageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Metadata - M8 Workbench</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/meta.css">
  <script>
    /* 主题要在 head 里就定下来，否则黑夜主题会先闪白底 */
    try {
      var t = localStorage.getItem("m8web.theme");
      document.documentElement.dataset.theme = t || "night";
    } catch (e) {
      document.documentElement.dataset.theme = "night";
    }
  </script>
</head>
<body>
  <div id="fx" aria-hidden="true"></div>
  <div class="shell">
    <div id="sidebar"></div>
    <div class="main">
      <div id="topbar" class="topbar"></div>
      <div class="content">
        <section class="meta">

          <header class="meta-head">
            <div>
              <h1 data-i18n="feat.meta.name">Image Metadata</h1>
              <p data-i18n="metaLede">Drop in an image and it is parsed automatically: generation parameters, embedded workflow, EXIF, file info. Everything is read on this machine and the image is never uploaded.</p>
            </div>
            <button class="ghost-btn is-hidden" id="metaAgain" type="button" data-i18n="metaAgain">Pick another</button>
          </header>

          <div class="drop" id="metaDrop">
            <input id="metaFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
            <span class="drop-ico" aria-hidden="true">＋</span>
            <strong data-i18n="dropPrompt">Click to choose, drag it in, or paste with Ctrl+V</strong>
            <small id="metaHint" data-i18n="metaHint">PNG / JPEG / WebP / GIF</small>
          </div>

          <div class="meta-body is-hidden" id="metaBody">
            <div class="meta-preview">
              <img id="metaThumb" alt="" data-i18n-attr="alt:imagePreviewAlt">
              <p class="meta-name" id="metaName"></p>
            </div>
            <div class="info-panels" id="metaPanels"></div>
          </div>

          <p class="status" id="metaStatus" role="status"></p>
        </section>
      </div>
    </div>
  </div>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/migrate.js"></script>
  <script src="../assets/js/meta.js"></script>
  <script type="module">
    import { bootI18n } from "../assets/js/i18n.js";
    await bootI18n();
    boot({ activeId: "meta", title: M8I18n.t("feat.meta.name", "Image Metadata"), base: "../" });
    M8Meta.init();
  </script>
</body>
</html>
