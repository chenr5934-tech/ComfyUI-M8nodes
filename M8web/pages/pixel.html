<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素风转化 · M8 工作台</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/pixel.css">
  <script>
    /* 与首页同一段：主题要在 head 里就定下来，否则黑夜主题会先闪白底 */
    try {
      var t = localStorage.getItem("m8web.theme");
      document.documentElement.dataset.theme = t || "night";
    } catch (e) {
      document.documentElement.dataset.theme = "night";
    }
  </script>
</head>
<body>
  <div id="fx" aria-hidden="true"></div>
  <div class="shell">
    <div id="sidebar"></div>
    <div class="main">
      <div id="topbar" class="topbar"></div>
      <div class="content">
        <section class="px">

          <header class="px-head">
            <div>
              <h1>像素风转化</h1>
              <p>把图压成低分辨率的像素画：抗锯齿卷积、面积平均降维、锐化卷积、减色抖动、最近邻放大。
                全程在本机算，图片不会上传。</p>
            </div>
          </header>

          <p class="px-note">
            <b>放大用的是最近邻，不是插值。</b>
            插值会把每个像素之间的边界糊掉，出来的只是一张低分辨率图，不是像素画。
            「像素块大小」是每个像素占多少原始像素 —— 调大就是更粗的颗粒。
          </p>

          <div class="px-form">
            <label class="px-field">
              <span>风格</span>
              <select id="pxStyle">
                <option value="standard" selected>标准 · 均值 3×3 抗锯齿</option>
                <option value="soft">柔和 · 高斯 5×5</option>
                <option value="crisp">硬朗 · 抗锯齿 + 锐化</option>
                <option value="clean">原味 · 不卷积</option>
              </select>
            </label>

            <label class="px-field">
              <span>像素块大小</span>
              <select id="pxBlock">
                <option value="2">2 px（最细）</option>
                <option value="3">3 px</option>
                <option value="4">4 px</option>
                <option value="6">6 px</option>
                <option value="8" selected>8 px</option>
                <option value="12">12 px</option>
                <option value="16">16 px</option>
                <option value="24">24 px</option>
                <option value="32">32 px（最粗）</option>
              </select>
            </label>

            <label class="px-field">
              <span>颜色数</span>
              <select id="pxLevels">
                <option value="0">不限色</option>
                <option value="3">每通道 3 档（27 色）</option>
                <option value="4">每通道 4 档（64 色）</option>
                <option value="6">每通道 6 档（216 色）</option>
                <option value="8" selected>每通道 8 档（512 色）</option>
                <option value="16">每通道 16 档（4096 色）</option>
                <option value="32">每通道 32 档</option>
              </select>
            </label>

            <label class="px-field">
              <span>放大倍数</span>
              <select id="pxZoom">
                <option value="1">1×（保持像素尺寸）</option>
                <option value="2">2×</option>
                <option value="3">3×</option>
                <option value="4" selected>4×</option>
                <option value="6">6×</option>
                <option value="8">8×</option>
                <option value="12">12×</option>
                <option value="16">16×</option>
              </select>
            </label>

            <label class="px-check">
              <input id="pxDither" type="checkbox" checked>
              <span>有序抖动（用规则点阵换更丰富的过渡）</span>
            </label>
          </div>

          <div class="drop" id="pxDrop">
            <input id="pxFile" type="file" accept="image/png,image/jpeg,image/webp">
            <img class="drop-thumb is-hidden" id="pxThumb" alt="要转化的图">
            <span class="drop-ico" id="pxIco" aria-hidden="true">＋</span>
            <strong>点击选择、拖进来，或者 Ctrl+V 粘贴</strong>
            <small id="pxHint">PNG / JPEG / WebP</small>
          </div>

          <div class="px-actions">
            <button class="gen-btn" id="pxGo" type="button">转化</button>
            <button class="ghost-btn is-hidden" id="pxAgain" type="button">重来</button>
          </div>

          <div class="px-body is-hidden" id="pxBody">
            <div class="px-preview">
              <img id="pxOut" alt="像素图预览">
              <p class="px-meta" id="pxMeta"></p>
            </div>
            <div class="info-panels" id="pxPanels"></div>
          </div>

          <p class="status" id="pxStatus" role="status"></p>
        </section>
      </div>
    </div>
  </div>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/migrate.js"></script>
  <script src="../assets/js/pixel.js"></script>
  <script>
    boot({ activeId: "pixel", title: "像素风转化", base: "../" });
    M8Pixel.init();
  </script>
</body>
</html>
