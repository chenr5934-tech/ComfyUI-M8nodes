<!DOCTYPE html>
<html lang="zh" data-i18n-title="feat.lora.pageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoRA 解析 · M8 工作台</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/shell.css">
  <link rel="stylesheet" href="../assets/css/lora.css">
  <script>
    try {
      var t = localStorage.getItem("m8web.theme");
      document.documentElement.dataset.theme = t || "night";
    } catch (e) {
      document.documentElement.dataset.theme = "night";
    }
  </script>
</head>
<body>
  <div id="fx" aria-hidden="true"></div>
  <div class="shell">
    <div id="sidebar"></div>
    <div class="main">
      <div id="topbar" class="topbar"></div>
      <div class="content">
        <section class="lora">

          <header class="lora-head">
            <div>
              <h1 data-i18n="feat.lora.name">LoRA 解析</h1>
              <p data-i18n="loraLede">拖一个 .safetensors 进来，读出它的训练参数和训练标签。</p>
            </div>
            <button class="ghost-btn is-hidden" id="loraAgain" type="button" data-i18n="loraAgain">换一个</button>
          </header>

          <!-- 这句要显眼：用户会担心几个 G 的模型被传走 -->
          <p class="lora-privacy">
            <b data-i18n="loraPrivacyLead">文件不会被上传，也不会落盘。</b>
            <span data-i18n="loraPrivacyBody">解析只读文件开头那一段（通常几 KB 到几十 KB），读完就把引用清掉 —— 几百 MB 的模型也是一瞬间的事，因为张量数据一个字节都没读。</span>
          </p>

          <div class="drop" id="loraDrop">
            <input id="loraFile" type="file" accept=".safetensors">
            <span class="drop-ico" aria-hidden="true">＋</span>
            <strong data-i18n="loraDrop">点击选择、拖进来，或者 Ctrl+V 粘贴</strong>
            <small id="loraHint" data-i18n="loraHint">只认 .safetensors</small>
          </div>

          <div class="lora-body is-hidden" id="loraBody">
            <div class="info-panels" id="loraPanels"></div>
          </div>

          <p class="status" id="loraStatus" role="status"></p>
        </section>
      </div>
    </div>
  </div>
  <!-- app.js / migrate.js / lora.js 是普通脚本，靠全局函数互相调用。
       下面那段用 module：module 天然延迟执行，正好等得到它们，也能用 import。 -->
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/migrate.js"></script>
  <script src="../assets/js/lora.js"></script>
  <script type="module">
    import { bootI18n } from "../assets/js/i18n.js";
    await bootI18n();
    boot({ activeId: "lora", title: M8I18n.t("feat.lora.name", "LoRA 解析"), base: "../" });
    M8Lora.init();
  </script>
</body>
</html>
